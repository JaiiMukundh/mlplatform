name: ci

# P4.2 — full continuous integration (lint, test, iac, chart, security).
# Local-quality wiring (iac/chart) is keep from P3.7; P4 adds the rest and pins.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Majors verified 2026-10-02 (checkout v7.0.1, setup-opentofu v2.0.2).
      - uses: actions/checkout@v7
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.0 yamllint==1.37.1
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: yamllint
        run: |
          yamllint deploy/ infra/ .github/ --no-parsable || true
      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/model_api.Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install deps
        run: uv sync --frozen
      - name: pytest + coverage gate
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
      - name: fmt (local)
        run: tofu -chdir=infra/envs/local fmt -check -recursive
      - name: validate (local)
        run: tofu -chdir=infra/envs/local init -backend=false && tofu -chdir=infra/envs/local validate
      - name: fmt (aws)
        run: tofu -chdir=infra/envs/aws fmt -check -recursive
      - name: validate (aws)
        run: tofu -chdir=infra/envs/aws init -backend=false && tofu -chdir=infra/envs/aws validate

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: helm lint
        run: |
          for d in deploy/charts/*; do
            [ -f "$d/Chart.yaml" ] || continue
            helm lint "$d" || exit 1
          done
      - name: helm template | kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.1/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          for d in deploy/charts/*; do
            [ -f "$d/Chart.yaml" ] || continue
            helm template "$d" | ./kubeconform -strict -summary || exit 1
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: "1"
