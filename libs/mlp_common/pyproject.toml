[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mlp-common"
version = "0.1.0"
description = "Shared configuration, logging, and schemas for MLPlatform services."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlp_common"]
