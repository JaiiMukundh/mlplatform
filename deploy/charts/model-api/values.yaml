replicaCount: 2

image:
  repository: localhost:5001/model-api
  tag: dev
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8080
  nodePort: 30080

env:
  MODEL_NAME: loan-default
  MODEL_VERSION: file-v1
  MODEL_SOURCE: file
  FEATURE_SOURCE: parquet
  LOG_LEVEL: INFO

modelFiles:
  # Init container pulls runtime artifacts from MinIO (P4.4). The image is
  # NEVER baked with artifacts from here on; keeping this out of the image
  # prepares P6 (full MLflow/Feast providers).
  enabled: true
  bucket: ml-data
  endpoint: http://minio.data.svc:9000
  secretName: minio-model
  secretKeys:
    accessKey: root-user
    secretKey: root-password
  clientImage:
    repository: bitnamilegacy/minio-client
    tag: 2025.7.21-debian-12-r2
    digest: sha256:7a6b4b93998903f1673d2bd2140ac26b807c4224627b743778c5a8f70db561f1
    pullPolicy: IfNotPresent

chaos:
  enabled: true

model:
  version: file-v1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 60

serviceMonitor:
  enabled: true

probes:
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    path: /healthz
  readiness:
    path: /readyz
