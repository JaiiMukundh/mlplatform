apiVersion: batch/v1
kind: Job
metadata:
  name: feast-setup
  namespace: data
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: feast
          image: localhost:5001/training:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: minio-auth, key: root-user}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-auth, key: root-password}
            - name: FEAST_S3_ENDPOINT_URL
              value: http://minio.data.svc:9000
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cd /app
              feast -c feature_repo apply
              python -m feature_repo.materialize --repo feature_repo --start 2020-01-01
