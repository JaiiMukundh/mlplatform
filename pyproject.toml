[project]
name = "mlplatform"
version = "0.1.0"
description = "Open-source-first laptop MLOps platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib==1.6.0",
  "mlp-common",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
]

[dependency-groups]
dev = [
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
]

[tool.uv.sources]
mlp-common = { workspace = true }

[tool.uv.workspace]
members = ["libs/mlp_common"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "artifacts", "data", "docs/SPEC.md", "mlruns"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["libs/mlp_common/tests", "ml/tests", "services"]

[tool.coverage.run]
branch = true
source = ["mlp_common"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
