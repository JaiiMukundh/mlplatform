[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "model-api"
version = "0.1.0"
description = "FastAPI model-serving service for MLPlatform."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "joblib==1.6.0",
  "mlp-common",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_api"]
