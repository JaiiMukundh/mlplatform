# Verify the Feast offline + online stores (P6.3 acceptance evidence). Run via
# `make feast-verify`, which deletes any previous Job first so it stays re-runnable.
apiVersion: batch/v1
kind: Job
metadata:
  name: feast-verify
  namespace: data
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: feast-verify
          image: __TRAINING_IMAGE__
          # Cloud image is injected by the Azure deployment.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-auth, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: postgres-password}}
            - {name: POSTGRES_HOST, value: postgres.data.svc}
            - {name: POSTGRES_PORT, value: "5432"}
            - {name: FEAST_POSTGRES_DB, value: feast}
            - {name: REDIS_HOST, value: redis.data.svc}
            - {name: REDIS_PORT, value: "6379"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: minio-auth, key: root-user}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-auth, key: root-password}}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            - {name: FEAST_S3_ENDPOINT_URL, value: http://minio.data.svc:9000}
            - {name: MPLCONFIGDIR, value: /tmp}
            - {name: HOME, value: /tmp}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cd /app
              mkdir -p /tmp/feature_repo
              cp /app/feature_repo/definitions.py /tmp/feature_repo/
              python -m feature_repo.render_config --output /tmp/feature_repo/feature_store.yaml
              FEAST_REPO=/tmp/feature_repo python -m feature_repo.verify
