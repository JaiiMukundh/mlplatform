# Score one candidate MLflow model version through the release gate (P7.1).
# Model bytes download through cluster-internal presigned URLs, so scoring
# runs in-cluster (training image). Run via `make gate-candidate VERSION=N`,
# which substitutes __CANDIDATE__ and deletes any previous Job first.
apiVersion: batch/v1
kind: Job
metadata:
  name: gate-candidate
  namespace: data
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: gate
          image: __TRAINING_IMAGE__
          # Cloud image is injected by the Azure deployment.
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          env:
            - {name: MLFLOW_TRACKING_URI, value: http://mlflow.data.svc:5000}
            - {name: CANDIDATE_VERSION, value: "__CANDIDATE__"}
            # gate.py imports the ml package; script-dir execution does not
            # put /app on sys.path the way `python -m` does.
            - {name: PYTHONPATH, value: /app}
            - {name: MPLCONFIGDIR, value: /tmp}
            - {name: HOME, value: /tmp}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cd /app
              python scripts/gate.py --candidate "$CANDIDATE_VERSION" \
                --out /tmp/gate_report.json
